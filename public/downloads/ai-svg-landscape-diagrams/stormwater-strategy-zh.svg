<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" xml:lang="zh-CN" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">雨水管理策略示意图</title>
  <desc id="diagram-description">概念平面图：左上为建筑，右上为停车场，左下为裸地试验田，右下为滞洪池。蓝色径流箭头沿绿色草沟进入滞洪池，假设场地整体向右下倾斜。</desc>
  <defs>
    <marker id="runoff-arrow" viewBox="0 0 12 12" markerWidth="19" markerHeight="19" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#287caa"/></marker>
    <marker id="fall-arrow" viewBox="0 0 12 12" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#64747b"/></marker>
  </defs>
  <rect id="background" width="1200" height="800" fill="#ffffff"/>
  <g id="land-use" stroke-width="2">
    <rect id="site-boundary" x="64" y="130" width="1072" height="504" rx="8" fill="#fbfcfc" stroke="#d8dfe0"/>
    <g id="building"><rect x="114" y="184" width="360" height="140" rx="4" fill="#d9dddf" stroke="#88959b"/><rect x="126" y="196" width="336" height="116" rx="2" fill="none" stroke="#f4f6f7"/></g>
    <g id="parking"><rect x="744" y="184" width="336" height="140" rx="4" fill="#e4e7e9" stroke="#88959b"/><path d="M760 201H1064 M760 304H1064 M776 291V304 M812 291V304 M848 291V304 M884 291V304 M920 291V304 M956 291V304 M992 291V304 M1028 291V304" fill="none" stroke="#ffffff" stroke-width="3"/></g>
    <g id="test-plot"><rect x="114" y="446" width="360" height="150" rx="4" fill="#e7d1b9" stroke="#b99a78"/><path d="M132 572H456 M132 583H456" stroke="#c8ab8e" stroke-width="1.5"/></g>
    <g id="detention-pond"><ellipse cx="912" cy="538" rx="155" ry="91" fill="#d5eaf4" stroke="#7da8bd"/><ellipse cx="912" cy="538" rx="138" ry="74" fill="none" stroke="#edf7fc" stroke-width="2"/></g>
  </g>
  <g id="swales" fill="none" stroke="#9cbb8d" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path id="building-swale" d="M453 351Q500 392 565 423L785 507"/>
    <path id="parking-swale" d="M1035 342C1036 384 1042 435 1042 493"/>
    <path id="plot-swale" d="M485 550C578 564 654 550 780 550"/>
  </g>
  <g id="runoff" fill="none" stroke="#287caa" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#runoff-arrow)">
    <path id="building-runoff" d="M430 320Q439 359 485 382" stroke-width="4"/>
    <path id="central-runoff-1" d="M518 402L602 437" stroke-width="5.5"/>
    <path id="central-runoff-2" d="M660 461L794 511" stroke-width="5.5"/>
    <path id="parking-runoff" d="M1035 322C1036 365 1042 410 1046 510" stroke-width="4"/>
    <path id="plot-runoff-1" d="M472 550C532 560 566 560 612 555" stroke-width="4"/>
    <path id="plot-runoff-2" d="M660 552L790 550" stroke-width="5.5"/>
  </g>
  <g id="labels" font-family="Arial, Microsoft YaHei, sans-serif" fill="#253b44">
    <text id="title-label" x="64" y="57" font-size="36" font-weight="600">雨水管理策略示意图</text>
    <text id="subtitle-label" x="64" y="93" font-size="21" fill="#5a6d75">地表径流 → 草沟 → 滞洪池</text>
    <g id="building-label" text-anchor="middle"><text x="294" y="238" font-size="30" font-weight="600">建筑</text><text x="294" y="275" font-size="20" fill="#52656d">屋面及周边硬质铺地</text></g>
    <g id="parking-label" text-anchor="middle"><text x="912" y="238" font-size="30" font-weight="600">停车场</text><text x="912" y="275" font-size="20" fill="#52656d">边缘收集径流</text></g>
    <g id="plot-label" text-anchor="middle"><text x="294" y="496" font-size="27" font-weight="600">裸地试验田</text><text x="294" y="532" font-size="20" fill="#705d4b">概念性裸露地表</text></g>
    <g id="pond-label" text-anchor="middle"><text x="912" y="530" font-size="28" font-weight="600">滞洪池</text><text x="912" y="568" font-size="20" fill="#456e81">暂时储存雨水</text></g>
    <g id="swale-label"><text x="518" y="350" font-size="22" fill="#4a7140">草沟</text><path d="M580 363L552 397" fill="none" stroke="#6b7d65" stroke-width="1.5"/></g>
    <g id="slope-label"><text x="782" y="159" font-size="16" fill="#64747b">假设整体向右下倾斜</text><path d="M1096 144L1118 166" fill="none" stroke="#64747b" stroke-width="2" marker-end="url(#fall-arrow)"/></g>
  </g>
  <g id="legend" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#475d66">
    <rect x="64" y="668" width="23" height="17" fill="#d9dddf" stroke="#88959b"/><text x="98" y="683">建筑与铺地</text>
    <rect x="282" y="668" width="23" height="17" fill="#e7d1b9" stroke="#b99a78"/><text x="316" y="683">裸地</text>
    <rect x="488" y="668" width="23" height="17" fill="#9cbb8d"/><text x="522" y="683">草沟</text>
    <rect x="726" y="668" width="23" height="17" fill="#d5eaf4" stroke="#7da8bd"/><text x="760" y="683">滞洪池</text>
    <path d="M963 677H993" fill="none" stroke="#287caa" stroke-width="4" marker-end="url(#runoff-arrow)"/><text x="1010" y="683">地表径流</text>
  </g>
  <g id="notes" font-family="Arial, Microsoft YaHei, sans-serif" fill="#5a6d75"><path d="M64 711H1136" stroke="#d8dfe0"/><text id="disclaimer" x="64" y="746" font-size="22">概念示意，非工程设计</text><text id="assumption-note" x="64" y="778" font-size="18">流向基于假设；未标注比例尺或计算数据。</text></g>
</svg>
