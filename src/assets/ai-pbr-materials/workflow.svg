<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">From a material photo to a tested PBR material</title>
  <desc id="desc">Inspect the image, build maps with a shared layout, render in Blender, check and revise, and deliver the files. Six icons explain Base Color, Normal, Height, Roughness, Ambient Occlusion, and Metallic.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a26145" stroke-width="1.5"/></marker>
    <linearGradient id="roughness"><stop stop-color="#505864"/><stop offset="1" stop-color="#d9dddf"/></linearGradient>
    <radialGradient id="ao"><stop stop-color="#505864"/><stop offset="1" stop-color="#eef0f0"/></radialGradient>
  </defs>
  <rect width="1120" height="600" rx="20" fill="#f6f3ee"/>
  <g font-family="Arial, sans-serif" fill="#263336">
    <text x="40" y="46" font-size="23" font-weight="700">From a material photo to a tested PBR material</text>
    <text x="40" y="74" font-size="15" fill="#626a6b">AI organizes the work. Image tools build the maps. A real renderer tests the result.</text>
    <g fill="#fff" stroke="#ddd7cf"><rect x="40" y="106" width="184" height="132" rx="12"/><rect x="254" y="106" width="184" height="132" rx="12"/><rect x="468" y="106" width="184" height="132" rx="12"/><rect x="682" y="106" width="184" height="132" rx="12"/><rect x="896" y="106" width="184" height="132" rx="12"/></g>
    <g stroke="#a26145" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M231 172h15M445 172h15M659 172h15M873 172h15" marker-end="url(#arrow)"/>
      <rect x="112" y="124" width="40" height="30" rx="4"/><circle cx="143" cy="132" r="3"/><path d="m116 150 10-11 8 8 7-7 7 10"/>
      <rect x="325" y="124" width="17" height="13" rx="2"/><rect x="350" y="124" width="17" height="13" rx="2"/><rect x="325" y="142" width="17" height="13" rx="2"/><rect x="350" y="142" width="17" height="13" rx="2"/>
      <path d="m560 124 19 10v20l-19 10-19-10v-20zM541 134l19 10 19-10M560 144v20"/>
      <circle cx="774" cy="142" r="18"/><path d="m765 142 6 6 12-14"/>
      <path d="M968 132h16l6 6h19v24h-41zM991 124v20m-6-6 6 6 6-6"/>
    </g>
    <g font-size="17" font-weight="700" text-anchor="middle"><text x="132" y="188">1 Inspect</text><text x="346" y="188">2 Build maps</text><text x="560" y="188">3 Render</text><text x="774" y="188">4 Check and revise</text><text x="988" y="188">5 Deliver</text></g>
    <g font-size="13" text-anchor="middle" fill="#626a6b"><text x="132" y="214">Color, relief, lighting</text><text x="346" y="214">One shared layout</text><text x="560" y="214">Wall, sphere, tiled plane</text><text x="774" y="214">Code and visual checks</text><text x="988" y="214">Maps, scene, report</text></g>
    <path d="M774 246v22H560v-21" fill="none" stroke="#a26145" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="667" y="290" font-size="13" text-anchor="middle" fill="#626a6b">Render again after corrections</text>
    <text x="40" y="331" font-size="18" font-weight="700">Six maps with different jobs</text>
    <g fill="#fff" stroke="#ddd7cf"><rect x="40" y="353" width="336" height="88" rx="10"/><rect x="392" y="353" width="336" height="88" rx="10"/><rect x="744" y="353" width="336" height="88" rx="10"/><rect x="40" y="457" width="336" height="88" rx="10"/><rect x="392" y="457" width="336" height="88" rx="10"/><rect x="744" y="457" width="336" height="88" rx="10"/></g>
    <g>
      <rect x="58" y="376" width="42" height="42" rx="7" fill="#bac4bd"/><circle cx="71" cy="389" r="7" fill="#84958b"/><circle cx="86" cy="404" r="9" fill="#d7cfb9"/>
      <rect x="410" y="376" width="42" height="42" rx="7" fill="#8685ef"/><path d="m421 407 20-20m-11 0h11v11" stroke="#fff" stroke-width="2.2" fill="none"/>
      <rect x="762" y="376" width="42" height="42" rx="7" fill="#81878a"/><path d="M769 385h10v21h18" stroke="#fff" stroke-width="2.2" fill="none"/>
      <rect x="58" y="480" width="42" height="42" rx="7" fill="url(#roughness)"/>
      <rect x="410" y="480" width="42" height="42" rx="7" fill="url(#ao)"/>
      <rect x="762" y="480" width="42" height="42" rx="7" fill="#182023"/><text x="783" y="508" font-size="23" fill="#fff" text-anchor="middle">0</text>
    </g>
    <g font-size="17" font-weight="700"><text x="116" y="389">Base Color</text><text x="468" y="389">Normal</text><text x="820" y="389">Height</text><text x="116" y="493">Roughness</text><text x="468" y="493">Ambient Occlusion</text><text x="820" y="493">Metallic</text></g>
    <g font-size="14" fill="#626a6b"><text x="116" y="414">Surface color and pattern</text><text x="468" y="414">Small details catching light</text><text x="820" y="414">Relative surface relief</text><text x="116" y="518">Sharp or broad reflections</text><text x="468" y="518">Local shading in recesses</text><text x="820" y="518">Zero for this concrete</text></g>
    <text x="40" y="578" font-size="13" fill="#626a6b">Map icons explain their roles. Test images in the article come from the supplied Cycles report.</text>
  </g>
</svg>
