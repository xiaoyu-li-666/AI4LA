<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Three stages of delta formation</title>
  <desc id="desc">A river delivers sediment, a submerged mouth bar grows, and flow divides around the bar toward two new deposits.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#287caa"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="7" height="7" fill="#e7d3b6"/><path d="M0 0V7" stroke="#b79168"/></pattern>
    <g id="base"><rect x="0" y="0" width="182" height="296" fill="#eef7fb" stroke="#cbd7d9"/><path d="M0 0H78L77 78H0Z M182 0H104L105 78H182Z" fill="#eee3c9" stroke="#bbae90"/><path d="M91 15V82" stroke="#287caa" stroke-width="3" marker-end="url(#arrow)"/></g>
    <g id="fan" fill="none" stroke="#287caa" stroke-width="2.5" marker-end="url(#arrow)"><path d="M91 87Q73 129 48 181"/><path d="M91 89V184"/><path d="M91 87Q109 129 134 181"/></g>
    <g id="sediment" fill="#925a35"><circle cx="88" cy="117" r="2.5"/><circle cx="95" cy="125" r="2.5"/><circle cx="83" cy="130" r="2.5"/><circle cx="91" cy="136" r="2.5"/><circle cx="99" cy="137" r="2.5"/><circle cx="90" cy="145" r="2.5"/></g>
  </defs>
  <rect width="640" height="400" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#53676e" font-size="13" letter-spacing="2"><text x="27" y="36">01 / DELIVERY</text><text x="229" y="36">02 / BUILDUP</text><text x="431" y="36">03 / BRANCHING</text></g>
  <g transform="translate(27 55)"><use href="#base"/><ellipse cx="91" cy="135" rx="26" ry="33" fill="#dfc5a2" opacity=".45"/><use href="#fan"/><use href="#sediment"/></g>
  <g transform="translate(229 55)"><use href="#base"/><ellipse cx="91" cy="143" rx="43" ry="53" fill="url(#hatch)"/><use href="#fan"/><use href="#sediment"/><use href="#sediment" transform="translate(4 16)"/><use href="#sediment" transform="translate(-4 8)"/></g>
  <g transform="translate(431 55)"><use href="#base"/><path d="M91 100C45 101 47 154 29 186C8 237 62 267 88 233C94 223 88 211 95 220C123 267 174 236 152 189C135 158 139 103 91 100Z" fill="url(#hatch)"/><ellipse cx="91" cy="146" rx="15" ry="19" fill="#eee3c9" stroke="#aa9270"/><ellipse cx="43" cy="217" rx="12" ry="15" fill="#eee3c9" stroke="#aa9270"/><ellipse cx="139" cy="217" rx="12" ry="15" fill="#eee3c9" stroke="#aa9270"/><g fill="none" stroke="#287caa" stroke-width="2.5" marker-end="url(#arrow)"><path d="M91 85C83 111 40 124 43 187"/><path d="M91 85C99 111 142 124 139 187"/></g><use href="#sediment" transform="translate(0 10)"/><g fill="#925a35"><circle cx="40" cy="214" r="2"/><circle cx="46" cy="221" r="2"/><circle cx="136" cy="214" r="2"/><circle cx="143" cy="221" r="2"/></g></g>
  <path d="M27 375H609" stroke="#cbd7d9"/><g font-family="Arial,sans-serif" font-size="12" fill="#53676e"><text x="27" y="392">FLOW → SETTLING → ACCUMULATION → BRANCHING</text></g>
</svg>
